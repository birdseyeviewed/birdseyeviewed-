
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds Eye View</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050405;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ff234b;
  background-image: radial-gradient(#260610 1px, transparent 1px);
  background-size: 22px 22px;
}

main {
  width: 100%;
  padding: 24px 12px;
  text-align: center;
}

h1 {
  margin: 0;
  font-family: 'Pirata One', 'Times New Roman', serif;
  font-size: clamp(42px, 10vw, 88px);
  font-weight: 400;
  letter-spacing: 1px;
  line-height: 1.15;
  color: #ff234b;
  text-shadow:
    0 0 2px #ffb9c8,
    0 0 7px #ff1744,
    0 0 18px #c90030,
    0 0 35px #690019;
  animation: flicker 5s infinite;
}

img {
  display: block;
  width: 180px;
  max-width: 75%;
  height: auto;
  margin: 28px auto 0;
}

@keyframes flicker {
  0%, 18%, 20%, 22%, 60%, 62%, 100% {
    opacity: 1;
  }

  19%, 61% {
    opacity: .75;
  }

  21% {
    opacity: .9;
  }
}

@media (prefers-reduced-motion: reduce) {
  h1 {
    animation: none;
  }
}
</style>
</head>

<body>
<main>
  <h1>BIRDS EYE VIEW</h1>
  <img src="bild.jpg" alt="">
</main>

  ody>
