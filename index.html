
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds Eye View</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050405;
  color: #ff1744;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: monospace;
  background-image: radial-gradient(#260610 1px, transparent 1px);
  background-size: 20px 20px;
}

.page {
  width: 100%;
  padding: 24px 10px;
  text-align: center;
}

h1 {
  margin: 0;
  font-family: 'UnifrakturMaguntia', serif;
  font-size: clamp(38px, 10vw, 88px);
  font-weight: normal;
  letter-spacing: 1px;
  color: #ff244f;
  text-shadow:
    0 0 2px #ffb3c1,
    0 0 6px #ff1744,
    0 0 14px #e60035,
    0 0 30px #8b001f;
  animation: neon 3.7s infinite;
}

.gif {
  display: block;
  width: 180px;
  max-width: 70vw;
  height: auto;
  margin: 30px auto 0;
}

@keyframes neon {
  0%, 18%, 22%, 25%, 53%, 57%, 100% {
    opacity: 1;
    text-shadow:
      0 0 2px #ffb3c1,
      0 0 6px #ff1744,
      0 0 14px #e60035,
      0 0 30px #8b001f;
  }

  20%, 24%, 55% {
    opacity: .72;
    text-shadow: 0 0 3px #ff1744;
  }

  56% {
    opacity: .9;
  }
}

@media (prefers-reduced-motion: reduce) {
  h1 {
    animation: none;
  }
}
</style>
</head>

<body>
<main class="page">
  <h1>BIRDS EYE VIEW</h1>
  <img class="gif" src="gifs/deinbild.gif" alt="">
</main>
</b
  ody>
</html>
