
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds Eye View</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #050405;
  color: #ff173f;
  font-family: monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  background-image:
    radial-gradient(#300711 1px, transparent 1px);
  background-size: 20px 20px;
}

.page {
  width: 100%;
  max-width: 1100px;
  padding: 24px 12px;
  text-align: center;
}

.gif-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin: 20px auto;
  flex-wrap: wrap;
}

.gif-slot {
  width: 90px;
  height: 90px;
  border: 1px solid #4d1020;
  background: #0b070a;
  box-shadow: 0 0 12px #35000d;
  overflow: hidden;
}

.gif-slot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.title-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.side-slot {
  width: 70px;
  height: 100px;
  flex-shrink: 0;
}

h1 {
  margin: 0;
  font-size: clamp(26px, 7vw, 76px);
  font-weight: 900;
  letter-spacing: -2px;
  overflow-wrap: anywhere;
  color: #ff1c43;
  text-shadow:
    0 0 5px #ff002b,
    0 0 15px #d0002b,
    0 0 35px #710019;
  animation: flicker 2s steps(2, end) infinite;
}

@keyframes flicker {
  0%, 90%, 100% { opacity: 1; }
  92% { opacity: .45; }
  94% { opacity: .9; }
  96% { opacity: .3; }
}

@media (max-width: 480px) {
  .gif-slot { width: 68px; height: 68px; }
  .side-slot { width: 34px; height: 65px; }
  .title-row { gap: 6px; }
  h1 { letter-spacing: -1.5px; }
}
</style>
</head>
<body>
<main class="page">

  <div class="gif-row">
    <div class="gif-slot"></div>
    <div class="gif-slot"></div>
    <div class="gif-slot"></div>
    <div class="gif-slot"></div>
  </div>

  <div class="title-row">
    <div class="gif-slot side-slot"></div>
    <h1>BIRDS EYE VIEW</h1>
    <div class="gif-slot side-slot"></div>
  </div>

  <div class="gif-row">
    <div class="gif-slot"></div>
    <div class="gif-slot"></div>
    <div class="gif-slot"></div>
    <div class="gif-slot"></div>
  </div>

</main>
</body>
</html>
